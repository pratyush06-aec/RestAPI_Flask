<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VisionAI classification result — see what the AI predicted for your uploaded image." />
  <title>Result — VisionAI</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>

  <!-- ===== Navbar ===== -->
  <nav class="navbar-custom">
    <div style="max-width: 1100px; margin: 0 auto; padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between;">
      <a href="/" class="navbar-brand-custom">
        <span class="brand-icon">🔬</span>
        VisionAI
      </a>
      <div style="display: flex; gap: 0.5rem;">
        <a href="/" class="nav-link-custom" id="nav-home">Home</a>
        <a href="/history" class="nav-link-custom" id="nav-history">📊 History</a>
      </div>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <main style="max-width: 780px; margin: 0 auto; padding: 0 1.5rem 3rem;">

    <div class="page-hero animate-fade-in-up">
      <h1>Classification Result</h1>
      <p>Here's what VisionAI thinks your image contains.</p>
    </div>

    <div class="glass-card result-card animate-fade-in-up delay-1">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: center;">

        <!-- Image Preview -->
        <div class="result-image-wrapper animate-fade-in delay-2">
          <img src="{{ url_for('static', filename=image.replace('static/', '')) }}" alt="Uploaded image" />
        </div>

        <!-- Prediction Details -->
        <div class="animate-slide-in-left delay-3">
          <div style="margin-bottom: 0.3rem;">
            <span class="badge-custom badge-success">✅ Classification Complete</span>
          </div>

          <div style="margin-top: 1.2rem;">
            <div style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 0.3rem;">Prediction</div>
            <div class="result-label">{{ prediction }}</div>
          </div>

          <div style="margin-top: 1.5rem;">
            <div style="color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; margin-bottom: 0.3rem;">Confidence</div>
            <div class="result-confidence">{{ confidence }}%</div>
            <div class="confidence-bar-wrapper">
              <div class="confidence-bar-fill" id="confidence-bar" style="width: 0%;"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Action Buttons -->
    <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;" class="animate-fade-in-up delay-4">
      <a href="/" class="btn-primary-custom">🖼️ Classify Another</a>
      <a href="/history" class="btn-outline-custom">📊 View History</a>
    </div>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer-custom">
    <p>Built with 🧠 Flask &amp; Hugging Face Transformers &bull; VisionAI &copy; 2026</p>
  </footer>

  <script>
    // Animate confidence bar
    window.addEventListener('DOMContentLoaded', () => {
      const bar = document.getElementById('confidence-bar');
      setTimeout(() => {
        bar.style.width = '{{ confidence }}%';
      }, 400);
    });
  </script>

</body>
</html>
